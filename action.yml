name: Stack CI Gate
description: A CI gate to optimize GitHub stacked PRs (gh stack). Stop rerunning CI on every layer of stacked pull requests.
author: raulgg
branding:
  icon: layers
  color: purple

inputs:
  bottom-n:
    description: How many PRs at the bottom of the remaining stack should run CI
    required: false
    default: '1'
  run-top:
    description: Also run CI on the top PR of the stack
    required: false
    default: 'true'
  force-run-label:
    description: Pull request label that forces a mid-stack run. Empty disables it.
    required: false
    default: 'stack-ci:run'
  stack-wait-seconds:
    description: On opened or reopened, seconds to wait for the stack when another open PR could sit below this one (0-100). About 50 or less keeps a separate gate job at 1 billed minute.
    required: false
    default: '40'
  github-token:
    description: Token used to read pull request stack metadata
    required: false
    default: ${{ github.token }}
  pr-number:
    description: Override pull request number on pull_request events. Loads stack from the API.
    required: false
    default: ''

outputs:
  should-run:
    description: True means the jobs you gated should run
  reason:
    description: Why should-run is true or false
  is-stacked:
    description: Whether this PR is in a stack
  is-bottom:
    description: Whether this is the remaining bottom PR of the stack
  is-top:
    description: Whether this is the top PR
  position:
    description: Stack position, or empty
  size:
    description: Stack size, or empty

runs:
  using: node24
  main: src/gate.mjs
